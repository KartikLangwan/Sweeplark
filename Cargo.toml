[workspace]
resolver = "3"
members = ["crates/sweeplark-core", "crates/sweeplark-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = ""
authors = ["Sweeplark contributors"]

[workspace.dependencies]
sweeplark-core = { path = "crates/sweeplark-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
