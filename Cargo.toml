[workspace]
resolver = "3"
members = ["crates/sweeplark-core", "crates/sweeplark-cli", "app/src-tauri"]
# The desktop app needs WebView2 (Windows); build it explicitly with -p sweeplark-app.
default-members = ["crates/sweeplark-core", "crates/sweeplark-cli"]

[workspace.package]
version = "1.4.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = ""
authors = []

[workspace.dependencies]
sweeplark-core = { path = "crates/sweeplark-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
