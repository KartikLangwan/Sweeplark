[[cleaner]]
id = "windows.recent_files"
name = "Recent files list"
name_hi = "Recent files ki list"
description = "Explorer's list of recently opened files. The files themselves stay safe."
description_hi = "Explorer mein haal mein kholi gayi files ki list. Files khud safe rahengi."
category = "privacy"
risk = "ask"
privacy = true
default_enabled = false
[[cleaner.target]]
path = "%APPDATA%/Microsoft/Windows/Recent"
recursive = false
include = ["*.lnk"]
