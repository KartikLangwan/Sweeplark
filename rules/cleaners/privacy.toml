# Browsing data. All off by default, need the user's one-time consent, and always ask before running.

[[cleaner]]
id = "chrome.history"
name = "Chrome history"
description = "List of websites visited in Chrome."
description_hi = "Chrome mein kholi gayi websites ki list."
category = "privacy"
risk = "ask"
privacy = true
default_enabled = false
running = ["chrome.exe"]
note = "History cannot be restored. Bookmarks and passwords are kept."
note_hi = "History wapas nahi aayegi. Bookmarks aur passwords nahi hatenge."
[[cleaner.target]]
path = "%LOCALAPPDATA%/Google/Chrome/User Data/*"
recursive = false
include = ["History", "History-journal", "Visited Links", "Top Sites", "Top Sites-journal"]

[[cleaner]]
id = "chrome.cookies"
name = "Chrome cookies"
description = "Website cookies."
description_hi = "Websites ki cookies."
category = "privacy"
risk = "ask"
privacy = true
default_enabled = false
running = ["chrome.exe"]
note = "You will be signed out of all websites."
note_hi = "Aap saari websites se logout ho jayenge."
[[cleaner.target]]
path = "%LOCALAPPDATA%/Google/Chrome/User Data/*/Network"
recursive = false
include = ["Cookies", "Cookies-journal"]

