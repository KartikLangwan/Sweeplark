[[cleaner]]
id = "edge.cookies"
name = "Edge cookies"
description = "Website cookies."
description_hi = "Websites ki cookies."
category = "privacy"
risk = "ask"
privacy = true
default_enabled = false
running = ["msedge.exe"]
note = "You will be signed out of all websites."
note_hi = "Aap saari websites se logout ho jayenge."
[[cleaner.target]]
