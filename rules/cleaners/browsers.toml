# Browser caches. Only cache: no history, passwords, cookies or bookmarks (those are in privacy.toml).

[[cleaner]]
id = "chrome.cache"
name = "Google Chrome cache"
description = "Websites ki cached files. Login aur history safe rahenge."
category = "browser"
risk = "safe"
running = ["chrome.exe"]
[[cleaner.target]]
path = "%LOCALAPPDATA%/Google/Chrome/User Data/*/Cache"
[[cleaner.target]]
path = "%LOCALAPPDATA%/Google/Chrome/User Data/*/Code Cache"
[[cleaner.target]]
path = "%LOCALAPPDATA%/Google/Chrome/User Data/*/GPUCache"
[[cleaner.target]]
path = "%LOCALAPPDATA%/Google/Chrome/User Data/ShaderCache"
[[cleaner.target]]
path = "%LOCALAPPDATA%/Google/Chrome/User Data/GrShaderCache"

