# Developer tool caches. Off by default: they can be big, but deleting them means
# downloading packages again (costs data on metered connections).

[[cleaner]]
id = "dev.vscode.cache"
name = "VS Code cache"
description = "VS Code ki cached files. Settings aur extensions safe rahenge."
category = "developer"
risk = "safe"
running = ["code.exe"]
[[cleaner.target]]
path = "%APPDATA%/Code/Cache"
[[cleaner.target]]
path = "%APPDATA%/Code/CachedData"
[[cleaner.target]]
path = "%APPDATA%/Code/Code Cache"
[[cleaner.target]]
path = "%APPDATA%/Code/GPUCache"
[[cleaner.target]]
path = "%APPDATA%/Code/CachedExtensionVSIXs"

[[cleaner]]
id = "dev.npm.cache"
name = "npm cache"
description = "Node.js packages ki downloaded copies."
category = "developer"
risk = "ask"
default_enabled = false
note = "Agli install par packages dobara download honge."
[[cleaner.target]]
path = "%LOCALAPPDATA%/npm-cache/_cacache"
min_age_hours = 24
remove_empty_dirs = true

