# Developer tool caches. Off by default: they can be big, but deleting them means
# downloading packages again (costs data on metered connections).

[[cleaner]]
id = "dev.vscode.cache"
name = "VS Code cache"
description = "Cached VS Code files. Settings and extensions stay safe."
description_hi = "VS Code ki cached files. Settings aur extensions safe rahenge."
category = "developer"
risk = "safe"
running = ["code.exe"]
[[cleaner.target]]
path = "%APPDATA%/Code/Cache"
[[cleaner.target]]
path = "%APPDATA%/Code/CachedData"
[[cleaner.target]]
path = "%APPDATA%/Code/Code Cache"
[[cleaner.target]]
path = "%APPDATA%/Code/GPUCache"
[[cleaner.target]]
path = "%APPDATA%/Code/CachedExtensionVSIXs"

[[cleaner]]
id = "dev.npm.cache"
name = "npm cache"
description = "Downloaded copies of Node.js packages."
description_hi = "Node.js packages ki downloaded copies."
category = "developer"
risk = "ask"
default_enabled = false
note = "Packages will be downloaded again on the next install."
note_hi = "Agli install par packages dobara download honge."
[[cleaner.target]]
path = "%LOCALAPPDATA%/npm-cache/_cacache"
min_age_hours = 24
remove_empty_dirs = true

