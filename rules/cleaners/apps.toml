[[cleaner]]
id = "java.cache"
name = "Java cache"
description = "Files downloaded by Java applets and Web Start."
description_hi = "Java applets aur Web Start ki downloaded files."
category = "apps"
risk = "safe"
[[cleaner.target]]
path = "%USERPROFILE%/AppData/LocalLow/Sun/Java/Deployment/cache"
