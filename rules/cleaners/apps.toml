# App caches (Electron apps etc.). Settings, chats and logins are not touched.

[[cleaner]]
id = "discord.cache"
name = "Discord cache"
description = "Cached images and media. Chats and login stay safe."
description_hi = "Images aur media ki cached files. Chats aur login safe rahenge."
category = "apps"
risk = "safe"
running = ["discord.exe"]
[[cleaner.target]]
path = "%APPDATA%/discord/Cache"
[[cleaner.target]]
path = "%APPDATA%/discord/Code Cache"
[[cleaner.target]]
path = "%APPDATA%/discord/GPUCache"

[[cleaner]]
id = "teams.classic.cache"
name = "Microsoft Teams (classic) cache"
description = "Cached Teams files. Chats and login stay safe."
description_hi = "Teams ki cached files. Chats aur login safe rahenge."
category = "apps"
risk = "safe"
running = ["teams.exe"]
[[cleaner.target]]
path = "%APPDATA%/Microsoft/Teams/Cache"
[[cleaner.target]]
path = "%APPDATA%/Microsoft/Teams/Code Cache"
[[cleaner.target]]
path = "%APPDATA%/Microsoft/Teams/GPUCache"

[[cleaner]]
id = "slack.cache"
name = "Slack cache"
description = "Cached Slack files. Chats and login stay safe."
description_hi = "Slack ki cached files. Chats aur login safe rahenge."
category = "apps"
risk = "safe"
running = ["slack.exe"]
[[cleaner.target]]
path = "%APPDATA%/Slack/Cache"
[[cleaner.target]]
path = "%APPDATA%/Slack/Code Cache"
[[cleaner.target]]
