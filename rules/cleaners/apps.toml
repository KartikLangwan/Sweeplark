# App caches (Electron apps etc.). Settings, chats and logins are not touched.

[[cleaner]]
id = "discord.cache"
name = "Discord cache"
description = "Cached images and media. Chats and login stay safe."
description_hi = "Images aur media ki cached files. Chats aur login safe rahenge."
category = "apps"
risk = "safe"
running = ["discord.exe"]
[[cleaner.target]]
path = "%APPDATA%/discord/Cache"
[[cleaner.target]]
path = "%APPDATA%/discord/Code Cache"
[[cleaner.target]]
path = "%APPDATA%/discord/GPUCache"

[[cleaner]]
id = "teams.classic.cache"
name = "Microsoft Teams (classic) cache"
description = "Cached Teams files. Chats and login stay safe."
description_hi = "Teams ki cached files. Chats aur login safe rahenge."
category = "apps"
risk = "safe"
running = ["teams.exe"]
[[cleaner.target]]
path = "%APPDATA%/Microsoft/Teams/Cache"
[[cleaner.target]]
path = "%APPDATA%/Microsoft/Teams/Code Cache"
[[cleaner.target]]
path = "%APPDATA%/Microsoft/Teams/GPUCache"

[[cleaner]]
id = "slack.cache"
name = "Slack cache"
description = "Cached Slack files. Chats and login stay safe."
description_hi = "Slack ki cached files. Chats aur login safe rahenge."
category = "apps"
risk = "safe"
running = ["slack.exe"]
[[cleaner.target]]
path = "%APPDATA%/Slack/Cache"
[[cleaner.target]]
path = "%APPDATA%/Slack/Code Cache"
[[cleaner.target]]
path = "%APPDATA%/Slack/GPUCache"

[[cleaner]]
id = "java.cache"
name = "Java cache"
description = "Files downloaded by Java applets and Web Start."
description_hi = "Java applets aur Web Start ki downloaded files."
category = "apps"
risk = "safe"
[[cleaner.target]]
path = "%USERPROFILE%/AppData/LocalLow/Sun/Java/Deployment/cache"

[[cleaner]]
id = "teams.new.cache"
name = "Microsoft Teams (new) cache"
name_hi = "Microsoft Teams (naya) cache"
description = "Cached files of the new Teams app. Chats and login stay safe."
description_hi = "Naye Teams app ki cached files. Chats aur login safe rahenge."
category = "apps"
risk = "safe"
running = ["ms-teams.exe", "msteams.exe"]
[[cleaner.target]]
path = "%LOCALAPPDATA%/Packages/MSTeams_8wekyb3d8bbwe/LocalCache/Microsoft/MSTeams/EBWebView/*/Cache"
[[cleaner.target]]
path = "%LOCALAPPDATA%/Packages/MSTeams_8wekyb3d8bbwe/LocalCache/Microsoft/MSTeams/EBWebView/*/Code Cache"
[[cleaner.target]]
path = "%LOCALAPPDATA%/Packages/MSTeams_8wekyb3d8bbwe/LocalCache/Microsoft/MSTeams/EBWebView/*/GPUCache"

[[cleaner]]
id = "spotify.cache"
name = "Spotify cache"
description = "Streamed songs Spotify keeps on disk."
description_hi = "Spotify ke stream kiye gaane ki cache."
category = "apps"
risk = "ask"
note = "If you saved songs for offline listening, Spotify may download them again."
note_hi = "Agar gaane offline ke liye save kiye hain, Spotify unhe dobara download kar sakta hai."
running = ["spotify.exe"]
[[cleaner.target]]
path = "%LOCALAPPDATA%/Spotify/Data"
remove_empty_dirs = true
[[cleaner.target]]
path = "%LOCALAPPDATA%/Spotify/Browser/Cache"

[[cleaner]]
id = "zoom.logs"
name = "Zoom logs"
description = "Old Zoom log files."
description_hi = "Zoom ki purani log files."
category = "apps"
risk = "safe"
running = ["zoom.exe"]
[[cleaner.target]]
path = "%APPDATA%/Zoom/logs"
min_age_hours = 24

[[cleaner]]
id = "onedrive.logs"
name = "OneDrive logs"
description = "Old OneDrive log files. Your synced files are not touched."
description_hi = "OneDrive ki purani log files. Sync hui files ko haath nahi lagega."
category = "apps"
risk = "safe"
[[cleaner.target]]
path = "%LOCALAPPDATA%/Microsoft/OneDrive/logs"
include = ["**/*.odl*", "**/*.aodl", "**/*.otc", "**/*.log", "**/*.etl"]
min_age_hours = 72

[[cleaner]]
id = "adobe.media_cache"
name = "Adobe media cache"
description = "Preview files Premiere Pro and After Effects rebuild when needed."
description_hi = "Premiere Pro aur After Effects ki preview files; zarurat par dobara ban jaati hain."
category = "apps"
risk = "ask"
note = "Open projects build their previews again the next time, which takes a while."
note_hi = "Projects agli baar previews dobara banayenge, thoda time lagega."
running = ["adobe premiere pro.exe", "afterfx.exe", "adobe media encoder.exe"]
[[cleaner.target]]
path = "%APPDATA%/Adobe/Common/Media Cache Files"
[[cleaner.target]]
path = "%APPDATA%/Adobe/Common/Media Cache"
[[cleaner.target]]
path = "%APPDATA%/Adobe/Common/Peak Files"
