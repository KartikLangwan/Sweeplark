size = 532517120
sha256 = "bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517"
license = "Apache-2.0"
context = 4096
# Small models write short summaries next to the app's own findings.
style = "brief"
description = "Lightest. For older PCs with 4–6 GB RAM."

