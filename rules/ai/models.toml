# Local AI models (GGUF, run with llama.cpp). Downloaded only when the user turns AI on.
# Files are pinned to an exact Hugging Face commit and checked with SHA-256 after download.

[runtime]
# llama.cpp release used to run the models (llama-server.exe). Verified with the
# SHA-256 digest GitHub publishes for each release asset.
llama_cpp_tag = "b12816"
cpu_asset_suffix = "bin-win-cpu-x64.zip"
gpu_asset_suffix = "bin-win-vulkan-x64.zip"

[[model]]
tier = "lite"
name = "Qwen3.5 0.8B"
