# Optimizer: privacy. Values follow optimizerDuck (GPL-3.0) and Microsoft policy docs.

[[tweak]]
id = "privacy.telemetry"
name = "Turn off telemetry"
description = "Sends the minimum diagnostic data, stops feedback prompts and the telemetry service and tasks."
category = "privacy"
risk = "ask"
recommended = true
restart = "reboot"
source = "https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization"
[[tweak.registry]]
key = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection'
name = "AllowTelemetry"
value = 0
[[tweak.registry]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
name = "AllowTelemetry"
value = 0
[[tweak.registry]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
name = "DoNotShowFeedbackNotifications"
value = 1
[[tweak.registry]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
name = "AllowDeviceNameInTelemetry"
value = 0
[[tweak.registry]]
key = 'HKCU\SOFTWARE\Microsoft\Siuf\Rules'
name = "NumberOfSIUFInPeriod"
value = 0
[[tweak.registry]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
name = "AITEnable"
value = 0
[[tweak.registry]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
name = "DisableInventory"
value = 1
[[tweak.registry]]
key = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "Start_TrackProgs"
value = 0
[[tweak.service]]
name = "DiagTrack"
start = "disabled"
[[tweak.service]]
name = "dmwappushservice"
start = "disabled"
[[tweak.task]]
path = '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser'
enabled = false
[[tweak.task]]
path = '\Microsoft\Windows\Application Experience\ProgramDataUpdater'
enabled = false
[[tweak.task]]
path = '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator'
enabled = false
[[tweak.task]]
path = '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip'
enabled = false
[[tweak.task]]
path = '\Microsoft\Windows\Autochk\Proxy'
enabled = false
[[tweak.task]]
path = '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector'
enabled = false

[[tweak]]
id = "privacy.error_reporting"
name = "Turn off error reporting"
description = "Crash reports are no longer sent to Microsoft."
category = "privacy"
risk = "ask"
[[tweak.registry]]
key = 'HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
name = "Disabled"
value = 1
[[tweak.registry]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\HandwritingErrorReports'
name = "PreventHandwritingErrorReports"
value = 1
[[tweak.service]]
name = "WerSvc"
start = "manual"

