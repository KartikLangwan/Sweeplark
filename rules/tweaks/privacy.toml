[[tweak]]
id = "privacy.delivery_optimization"
name = "Don't share updates with other PCs"
description = "Windows Update downloads only from Microsoft, not from or to other PCs on the internet."
category = "privacy"
risk = "safe"
note = "Windows updates come only from Microsoft, not from other PCs; can be slower."
note_hi = "Windows updates sirf Microsoft se aayenge, doosre PCs se nahi; thode dheeme ho sakte hain."
recommended = true
[[tweak.registry]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
name = "DODownloadMode"
value = 0

