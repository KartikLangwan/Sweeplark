[[tweak]]
id = "privacy.typing"
name = "Stop sending typing and inking data"
description = "Windows stops collecting what you type and write to 'improve' recognition."
category = "privacy"
risk = "safe"
note = "Websites no longer see your language list (pages may pick the language by region)."
note_hi = "Websites aapki language list nahi dekhengi (page region se language chun sakta hai)."
recommended = true
[[tweak.registry]]
key = 'HKCU\SOFTWARE\Microsoft\InputPersonalization'
name = "RestrictImplicitInkCollection"
value = 1
[[tweak.registry]]
key = 'HKCU\SOFTWARE\Microsoft\InputPersonalization'
name = "RestrictImplicitTextCollection"
value = 1
[[tweak.registry]]
key = 'HKCU\SOFTWARE\Microsoft\InputPersonalization\TrainedDataStore'
name = "HarvestContacts"
value = 0
[[tweak.registry]]
key = 'HKCU\Control Panel\International\User Profile'
name = "HttpAcceptLanguageOptOut"
value = 1

