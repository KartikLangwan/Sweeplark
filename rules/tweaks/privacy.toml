[[tweak]]
id = "privacy.location"
name = "Turn off location"
description = "Apps and Windows can't use your location. Maps stop auto-updating."
category = "privacy"
risk = "ask"
note = "Weather, Maps and Find my device won't know where you are."
[[tweak.registry]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
name = "DisableLocation"
value = 1
[[tweak.registry]]
key = 'HKLM\SYSTEM\Maps'
name = "AutoUpdateEnabled"
value = 0
[[tweak.registry]]
key = 'HKCU\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location'
name = "Value"
value = "Deny"

