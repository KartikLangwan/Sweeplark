risk = "safe"
setting = true
restart = "explorer"
[[tweak.registry]]
key = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "UseCompactMode"
value = 1
off = 0

[[tweak]]
id = "explorer.checkboxes"
