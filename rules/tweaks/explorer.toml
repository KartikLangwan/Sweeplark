# Optimizer: Explorer, taskbar and desktop settings. These are two-way switches.

[[tweak]]
id = "explorer.file_extensions"
name = "Show file extensions"
description = "See '.exe', '.pdf' and other extensions. Helps spot fake files."
category = "explorer"
risk = "safe"
recommended = true
setting = true
restart = "explorer"
[[tweak.registry]]
key = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "HideFileExt"
value = 0
off = 1

[[tweak]]
id = "explorer.hidden_files"
name = "Show hidden files"
description = "Shows files and folders marked as hidden."
category = "explorer"
risk = "safe"
setting = true
restart = "explorer"
[[tweak.registry]]
key = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "Hidden"
value = 1
off = 2

[[tweak]]
id = "explorer.launch_this_pc"
name = "Open Explorer to 'This PC'"
description = "File Explorer opens on your drives instead of Home/Quick access."
category = "explorer"
risk = "safe"
setting = true
[[tweak.registry]]
key = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "LaunchTo"
value = 1
off = 2

[[tweak]]
id = "explorer.compact"
