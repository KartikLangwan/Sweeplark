# Advice for well-known startup entries. `match` is a case-insensitive substring of the
# entry name or its command. First match wins, so put specific entries first.
# verdict: "keep" (needed: security, drivers, input devices), "disable" (safe to start by hand).

[[app]]
match = "securityhealth"
verdict = "keep"
note = "Windows Security ka icon aur alerts. Chalu rakhein."

[[app]]
match = "windowsdefender"
verdict = "keep"
note = "Antivirus. Chalu rakhein."

[[app]]
match = "rtkaud"
verdict = "keep"
note = "Realtek audio driver. Band karne se sound ki settings kaam nahi karengi."

[[app]]
match = "realtek"
verdict = "keep"
note = "Realtek driver ka hissa."

[[app]]
match = "igfx"
verdict = "keep"
note = "Intel graphics driver."

[[app]]
match = "synaptics"
verdict = "keep"
note = "Touchpad driver. Band karne se touchpad gestures ruk sakte hain."

[[app]]
match = "etdctrl"
verdict = "keep"
note = "ELAN touchpad driver."

[[app]]
match = "nvbackend"
verdict = "disable"
note = "NVIDIA GeForce Experience ka background hissa. Game recording use nahi karte toh band kar sakte hain."

[[app]]
match = "nvcplui"
verdict = "keep"
note = "NVIDIA control panel."

[[app]]
match = "spotify"
verdict = "disable"
note = "Spotify zarurat par khud khol sakte hain."

[[app]]
match = "discord"
verdict = "disable"
note = "Discord zarurat par khud khol sakte hain."

[[app]]
match = "steam"
verdict = "disable"
note = "Steam game khelte waqt khul jayega."

[[app]]
match = "epicgameslauncher"
verdict = "disable"
note = "Epic launcher game khelte waqt khol lein."

[[app]]
match = "microsoftedgeautolaunch"
verdict = "disable"
note = "Edge ko pehle se chalu rakhta hai. Band karne se PC jaldi start hoga."

[[app]]
match = "teams"
verdict = "disable"
note = "Teams roz kaam ke liye zaruri nahi toh band kar sakte hain."

[[app]]
match = "skype"
verdict = "disable"
note = "Skype zarurat par khud khol sakte hain."

[[app]]
match = "zoom"
verdict = "disable"
note = "Meeting link kholne par Zoom khud chal jata hai."

[[app]]
match = "onedrive"
verdict = "disable"
note = "Band karne par files tab tak sync nahi hongi jab tak OneDrive khud na kholein. Backup ke liye use karte hain toh chalu rakhein."

[[app]]
match = "googledrivesync"
verdict = "disable"
note = "Band karne par sync tab tak rukega jab tak Drive khud na kholein."

[[app]]
match = "dropbox"
verdict = "disable"
note = "Band karne par sync tab tak rukega jab tak Dropbox khud na kholein."

[[app]]
match = "adobe"
verdict = "disable"
note = "Adobe updater/helper. Adobe apps kholne par yeh khud chal jata hai."

[[app]]
match = "ccleaner"
verdict = "disable"
note = "Doosra cleaner background mein chalne ki zarurat nahi."

[[app]]
match = "utorrent"
verdict = "disable"
note = "Torrent app zarurat par khud kholein."

[[app]]
match = "bittorrent"
verdict = "disable"
note = "Torrent app zarurat par khud kholein."

[[app]]
match = "whatsapp"
verdict = "disable"
note = "WhatsApp zarurat par khud khol sakte hain."

[[app]]
match = "telegram"
verdict = "disable"
note = "Telegram zarurat par khud khol sakte hain."

[[app]]
match = "opera"
verdict = "disable"
note = "Browser ko startup mein chalane ki zarurat nahi."

[[app]]
match = "cortana"
verdict = "disable"
note = "Cortana zyadatar log use nahi karte."

[[app]]
match = "itunes"
verdict = "disable"
note = "iTunes helper. iPhone connect karte waqt iTunes khol lein."
