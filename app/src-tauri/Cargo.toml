[package]
name = "sweeplark-app"
description = "Sweeplark desktop app (Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "sweeplark_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sweeplark-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
sysinfo = "0.40"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
