name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --exclude sweeplark-app --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude sweeplark-app

  app:
    name: Build Windows installer
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install UI dependencies
        working-directory: app
        run: npm ci
      - name: Type-check UI
        working-directory: app
        run: npm run check
      - name: Build installer
        working-directory: app
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: sweeplark-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
