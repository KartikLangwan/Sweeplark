name: Release

# Bump "version" in app/src-tauri/tauri.conf.json and push to main: this builds the Windows
# installer + portable exe and publishes GitHub Release v<version> (creating the tag).
on:
  push:
    branches: [main]
    paths: ["app/src-tauri/tauri.conf.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time; a running upload is never cut off half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    # Releases only from main, also when started by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Versions match (Cargo.toml, tauri.conf.json, package.json)
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tauri = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $npm = (Get-Content app/package.json | ConvertFrom-Json).version
          if ($cargo -ne $tauri -or $tauri -ne $npm) { throw "Version mismatch: Cargo $cargo, tauri $tauri, npm $npm" }
      - name: Tests (a release is only built when they pass)
        run: cargo test --workspace --exclude sweeplark-app
      - name: Install UI dependencies
        working-directory: app
        run: npm ci
      - name: Type-check UI
        working-directory: app
        run: npm run check
      - name: Build
        working-directory: app
        run: npx tauri build
      - name: Collect files
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1) "out/Sweeplark-$v-Setup.exe"
          Copy-Item target/release/Sweeplark.exe "out/Sweeplark-$v-Portable.exe"
          Get-ChildItem out | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          Get-FileHash out/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File out/SHA256SUMS.txt -Encoding ascii
      - name: Release notes
        shell: pwsh
        run: |
          # "What's new" = the CHANGELOG section of this version (shown in the app's update dialog too).
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $env:VERSION" | Select-Object -First 1).LineNumber
          $notes = @()
          if ($start) {
            foreach ($l in $lines[$start..($lines.Count - 1)]) { if ($l -match '^## ') { break }; $notes += $l }
          }
          $table = @(
            "",
            "| File | For |",
            "|---|---|",
            "| ``Sweeplark-$env:VERSION-Setup.exe`` | **Recommended.** Installs for your user (no admin), starts with Windows in the tray, data in ``%LOCALAPPDATA%\Sweeplark``. |",
            "| ``Sweeplark-$env:VERSION-Portable.exe`` | Single exe, no install. Keeps its data in a ``SweeplarkData`` folder next to it. Needs the Microsoft Edge WebView2 Runtime (built into Windows 11). |",
            "",
            "Windows 10/11 (64-bit). Not code-signed yet, so SmartScreen may say ""Windows protected your PC"": click **More info → Run anyway**. Checksums are in ``SHA256SUMS.txt``."
          )
          (@("**Sweeplark** — Small bird. Clean PC.", "", "### What's new") + $notes + $table) | Out-File notes.md -Encoding utf8
      # Code signing (removes the SmartScreen warning once a certificate exists):
      # add Azure Trusted Signing or SignPath here and sign out/*.exe before upload.
      - uses: actions/upload-artifact@v4
        with:
          name: sweeplark-windows
          path: out/*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          make_latest: true
          overwrite_files: true
          name: Sweeplark v${{ env.VERSION }}
          files: out/*
          body_path: notes.md
